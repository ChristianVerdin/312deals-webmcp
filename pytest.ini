[pytest]
# Fast, isolated unit tests only. Every external/paid call (Anthropic, Gemini,
# Firecrawl, boto3/R2) is mocked; DB-touching tests use a temp SQLite fixture.
testpaths = tests/unit
python_files = test_*.py
python_functions = test_*
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
